name: Test and build immutable images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # Serialize publishers across refs so a main/tag/manual run cannot replace a tag.
  group: image-releases
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require independent frontend dependency directories
        run: |
          test ! -L frontend/node_modules
          test ! -L strategy-lab-frontend/node_modules
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install '.[dashboard,test]'
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            strategy-lab-frontend/package-lock.json
      - name: Install and validate public frontend
        working-directory: frontend
        run: |
          npm ci --include=dev --bin-links
          npm ls @playwright/test playwright
          ./node_modules/.bin/playwright --version
          npm run format:check
          npm run build
      - name: Install public frontend browser and system dependencies
        working-directory: frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Test public frontend
        working-directory: frontend
        run: npm test
      - name: Install and validate Strategy Lab
        working-directory: strategy-lab-frontend
        run: |
          npm ci --include=dev --bin-links
          npm ls @playwright/test playwright
          ./node_modules/.bin/playwright --version
          npm run format:check
          npm run build
      - name: Install Strategy Lab browser and system dependencies
        working-directory: strategy-lab-frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Test Strategy Lab
        working-directory: strategy-lab-frontend
        run: npm test

  release:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      repository: ${{ steps.release.outputs.repository }}
    steps:
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: application
            context: .
            dockerfile: Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: strategy-lab
            context: strategy-lab-frontend
            dockerfile: strategy-lab-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.release.outputs.repository }}/${{ matrix.image }}:${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" >manifest.txt 2>manifest-error.txt; then
            echo "::error::Release image already exists: $IMAGE. Rerun only failed jobs after a partial release; use a new commit for a new release."
            exit 1
          fi
          # Authentication, network, and registry errors must not permit an overwrite.
          if ! grep -Eq 'manifest unknown|MANIFEST_UNKNOWN|: not found' manifest-error.txt; then
            cat manifest-error.txt >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ needs.release.outputs.repository }}/${{ matrix.image }}:${{ needs.release.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Verify published architectures
        shell: bash
        env:
          IMAGE: ghcr.io/${{ needs.release.outputs.repository }}/${{ matrix.image }}:${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --raw > manifest.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | index("linux/amd64") != null and index("linux/arm64") != null' manifest.json

  summary:
    needs: [test, release, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare successful release artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: printf '%s\n' "$RELEASE_TAG" > release-tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-release-tag
          path: release-tag.txt
          if-no-files-found: error
      - name: DEPLOYMENT READY
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          REPOSITORY: ${{ needs.release.outputs.repository }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # DEPLOYMENT READY

          **Release:** \`$RELEASE_TAG\`

          **Application image:** \`ghcr.io/$REPOSITORY/application:$RELEASE_TAG\`

          **Frontend image:** \`ghcr.io/$REPOSITORY/frontend:$RELEASE_TAG\`

          **Strategy Lab image:** \`ghcr.io/$REPOSITORY/strategy-lab:$RELEASE_TAG\`

          Platforms: \`linux/amd64\`, \`linux/arm64\` (verified in GHCR).

          Hand this release tag to the separate \`homelab-k3s\` repository for manual deployment.
          This workflow builds and publishes images only; it does not access or deploy to a cluster.
          EOF
