name: Test and build immutable images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install '.[dashboard,test]'
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            strategy-lab-frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm ci --prefix strategy-lab-frontend
      - run: npm run format:check --prefix strategy-lab-frontend
      - run: npm run build --prefix strategy-lab-frontend
      - run: npx --prefix strategy-lab-frontend playwright install --with-deps chromium
      - run: npm test --prefix strategy-lab-frontend

  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      repository: ${{ steps.release.outputs.repository }}
    steps:
      - id: release
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha-${GITHUB_SHA::7}" > release-tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-release-tag
          path: release-tag.txt
          if-no-files-found: error

  build:
    needs: [test, release]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: application
            context: .
            dockerfile: Dockerfile
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - image: strategy-lab
            context: strategy-lab-frontend
            dockerfile: strategy-lab-frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ needs.release.outputs.repository }}/${{ matrix.image }}:${{ needs.release.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  summary:
    needs: [release, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          REPOSITORY: ${{ needs.release.outputs.repository }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # DEPLOYMENT READY

          **Release:** \`$RELEASE_TAG\`

          - \`ghcr.io/$REPOSITORY/application:$RELEASE_TAG\`
          - \`ghcr.io/$REPOSITORY/frontend:$RELEASE_TAG\`
          - \`ghcr.io/$REPOSITORY/strategy-lab:$RELEASE_TAG\`

          Deploy from the repository checkout:

          \
          GHCR_REPOSITORY=ghcr.io/$REPOSITORY ./scripts/deploy-k3s.sh $RELEASE_TAG
          \
          EOF
