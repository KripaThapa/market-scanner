[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ripster-scanner"
version = "0.1.0"
description = "Alpaca market context scanner"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py==0.44.0",
    "pandas==3.0.5",
    "python-dotenv==1.2.3",
    "exchange-calendars==4.13.2",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "Pillow>=11,<13", "SQLAlchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4"]
test = ["httpx>=0.28,<1"]

[project.scripts]
ripster-scanner = "ripster_scanner.app:main"

[tool.setuptools.packages.find]
include = ["ripster_scanner*", "backend*", "scanner*", "research*", "discovery*", "strategy_lab*"]
